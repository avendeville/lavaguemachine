<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Surfer la Vague Machine — Le livre</title>
  <link rel="stylesheet" href="style.css">

  <!-- COULEURS ET STYLE -->
  <style>
    :root {
      --sable: #F4E9D8;
      --noir: #111111;
      --brun: #8A6A3A;
    }
    body {
      background-color: var(--sable);
      color: var(--noir);
      font-family: Arial, sans-serif;
      margin: 70px auto;
      max-width: 780px;
      line-height: 1.65;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 40px;
      width: 3px;
      height: 100vh;
      background-color: var(--brun);
      opacity: 0.25;
    }
    
    h1, h2 { font-weight: normal; color: var(--brun); margin-top: 40px; }
    h1 { font-size: 34px; margin-bottom: 10px; }
    h2 { font-size: 22px; margin-bottom: 12px; }
    nav { display: flex; gap: 22px; margin-bottom: 40px; font-size: 1rem; letter-spacing: 0.03em; }
    a { color: var(--brun); text-decoration: none; opacity: 0.85; }
    a:hover { opacity: 1; text-decoration: underline; }
    .section { margin-bottom: 40px; }

/* Mobile : enlever la ligne verticale */
@media (max-width: 768px) {
  body::before {
    display: none !important;
  }
}

/* Mobile : agrandir le texte et ajouter des marges */
@media (max-width: 768px) {
  body {
    font-size: 18px !important;
    margin: 30px 20px !important;
  }
}

/* Mobile : menu sur 2 lignes, resserré, sans coupure */
@media (max-width: 768px) {
  nav {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 4px 10px !important;
    font-size: 18px !important;
  }

  nav a {
    white-space: nowrap !important;
  }
}
  </style>
</head>
