<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Vague Machine — Livre III</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --sable: #F4E9D8;
      --noir: #111111;
      --brun: #8A6A3A;
    }

    body {
      background-color: var(--sable);
      color: var(--noir);
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 780px;
      line-height: 1.65;
    }

    h1 {
      font-weight: normal;
      color: var(--brun);
      font-size: 22px;
      margin-bottom: 4px;
    }

    p {
      color: rgba(0,0,0,0.75);
    }

    footer.signature-site {
  margin-top: 60px;      /* espace au-dessus du footer, desktop */
  text-align: center;
}

footer.signature-site img {
  width: 80px;
}
 .copyright {
  font-size: 10px;
  opacity: 0.7;
  margin-top: 8px;
  text-align: center;
}
/* Mobile : footer reste bien sous l'image */
@media (max-width: 768px) {
  footer.signature-site {
    margin-top: 70px !important;
  }
/* Copyright : taille fixe sur mobile */
@media (max-width: 768px) {
  .copyright {
    font-size: 10px !important;
  }
}
  
  </style>
</head>

<body>

<!-- Bloc titre -->
<div class="header-flex">
  <div class="header-text">
    <h1>LA VAGUE MACHINE</h1>
    <h1>Livre III — L’Arkhé Labyrinthe</h1>
    <p><em style="color:var(--brun);">
      Traverser le dédale pour retrouver le commencement
    </em></p>
  </div>
</div>

<!-- Image de couverture -->
<div style="text-align:center; margin: 40px 0;">
  <img src="image_livreIII.png" alt="Couverture Livre III"
       style="width:280px; max-width:80%; height:auto;">
</div>

<footer class="signature-site" style="text-align:center; margin-top:40px;">
  <a href="index.html">
    <img src="symbole-architectonique-institutionnelle.webp" alt="Retour à l’accueil">
  </a>
  <p class="copyright">
    © 2026 Agnès Vendeville — La Vague Machine. Tous droits réservés.
  </p>
</footer>

</body>
</html>
