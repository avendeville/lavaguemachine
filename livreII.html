<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Vague Machine — Livre II</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --sable: #F4E9D8;
      --noir: #111111;
      --brun: #8A6A3A;
    }

    body {
      background-color: var(--sable);
      color: var(--noir);
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 780px;
      line-height: 1.65;
    }

    h1 {
      font-weight: normal;
      color: var(--brun);
      font-size: 22px;
      margin-bottom: 4px;
    }

    p {
      color: rgba(0,0,0,0.75);
    }

    /* Bloc image : marge propre */
    .bloc-image-livre {
      text-align: center;
      margin: 40px 0;
    }

    /* Footer desktop */
    footer.signature-site {
      text-align: center;
      margin-top: 60px;
    }

    footer.signature-site img {
      width: 80px;
    }
 .copyright {
  font-size: 10px;
  opacity: 0.7;
  margin-top: 8px;
  text-align: center;
}
   /* Mobile : footer reste bien sous l'image */
@media (max-width: 768px) {
  footer.signature-site {
    margin-top: 90px !important;
  }
/* Copyright : taille fixe sur mobile */
@media (max-width: 768px) {
  .copyright {
    font-size: 10px !important;
  }
}

   
  </style>
</head>

<body>

<!-- Bloc titre -->
<div class="header-flex">
  <div class="header-text">
    <h1>LA VAGUE MACHINE</h1>
    <h1>Livre II — La mécanique du système</h1>
    <p><em style="color:var(--brun);">
      Disséquer les rouages pour ne pas y laisser son âme
    </em></p>
  </div>
</div>

<!-- Image de couverture -->
<div class="bloc-image-livre">
  <img src="image_livreII.png" alt="Couverture Livre II"
       style="width:280px; max-width:80%; height:auto;">
</div>

<footer class="signature-site">
  <a href="index.html">
    <img src="symbole-architectonique-institutionnelle.webp" alt="Retour à l’accueil">
  </a>
  <p class="copyright">
    © 2026 Agnès Vendeville — La Vague Machine. Tous droits réservés.
  </p>
</footer>

</body>
</html>
