<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Agnès Vendeville</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* COULEURS */
    :root {
      --sable: #F4E9D8;
      --noir: #111;
      --brun: #8A6A3A;
    }

    /* STRUCTURE */
    body {
      background: var(--sable);
      color: var(--noir);
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 780px;
      line-height: 1.65;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 40px;
      width: 3px;
      height: 100vh;
      background: var(--brun);
      opacity: 0.25;
    }

    /* TITRE */
    h1 {
      font-weight: normal;
      color: var(--brun);
      margin-top: 40px;
      font-size: 22px;
    }

    /* LIENS */
    a {
      color: var(--brun);
      opacity: 0.85;
      text-decoration: none;
    }

    a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    nav { display: flex; gap: 22px; margin-bottom: 40px; font-size: 1rem; letter-spacing: 0.03em; }
    a { color: var(--brun); text-decoration: none; opacity: 0.85; }
    a:hover { opacity: 1; text-decoration: underline; }
    .section { margin-bottom: 40px; }

    /* MOBILE */
    @media (max-width: 768px) {

      body {
        margin: 0;
        padding: 20px;
        max-width: 100%;
        text-align: center;
      }

      body::before {
        display: none;
      }

      h1 {
        font-size: 22px;
        margin-top: 10px;
        margin-bottom: 16px;
      }

      p, a, strong {
        font-size: 17px;
        line-height: 1.55;
      }
    }
  </style>
</head>

<body>

  <!-- MENU GLOBAL (harmonisé via style.css) -->
  <nav>
    <a href="index.html">Accueil</a>
    <a href="livre.html">Le livre</a>
    <a href="apropos.html">À propos</a>
    <a href="vaguemachine.html">La Vague Machine</a>
    <a href="contact.html">Contact</a>
  </nav>

  <h1>Contact</h1>

  <p>
    Pour toute demande :<br>
    <a href="mailto:contact@lavaguemachine.fr">contact@lavaguemachine.fr</a>
  </p>

</body>
</html>
