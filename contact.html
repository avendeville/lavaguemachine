<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Agnès Vendeville</title>
  <link rel="stylesheet" href="style.css">

  <!-- COULEURS -->
  <style>
    :root { --sable:#F4E9D8; --noir:#111; --brun:#8A6A3A; }

    /* VERSION DESKTOP */
    body {
      background:var(--sable);
      color:var(--noir);
      font-family:Arial;
      margin:70px auto;
      max-width:780px;
      line-height:1.65;
      position:relative;
    }

    body::before {
      content:"";
      position:fixed;
      top:0;
      left:40px;
      width:3px;
      height:100vh;
      background:var(--brun);
      opacity:0.25;
    }

    h1 {
      font-weight:normal;
      color:var(--brun);
      margin-top:40px;
      font-size:34px;
    }

    nav {
      display:flex;
      gap:22px;
      margin-bottom:40px;
    }

    a {
      color:var(--brun);
      opacity:0.85;
      text-decoration:none;
    }

    a:hover {
      opacity:1;
      text-decoration:underline;
    }

    @media (max-width: 768px){
  body::before {
    display: none;
  }
}

/* Mobile : menu sur 2 lignes, resserré, sans coupure */
@media (max-width: 768px) {
  nav {
    display: flex;
    flex-wrap: wrap;     /* autorise 2 lignes */
    gap: 4px 10px;       /* espace vertical + horizontal resserré */
    font-size: 18px;     /* lisible mais pas énorme */
  }

  nav a {
    white-space: nowrap; /* empêche les mots d’être coupés */
  }
}

    @media (max-width: 768px) {
  .sceau-accueil {
    display: none !important;
  }
}

    @media (max-width: 768px) {
  nav {
    justify-content: center;
  }
}
      /* Titre */
      h1 {
        font-size: 28px !important;
        margin-top: 10px !important;
        margin-bottom: 16px !important;
      }

      /* Texte */
      p, a, strong {
        font-size: 17px !important;
        line-height: 1.55 !important;
      }
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">Accueil</a>
  <a href="livre.html">Le livre</a>
  <a href="apropos.html">À propos</a>
  <a href="vaguemachine.html">La Vague Machine</a>
  <a href="contact.html">Contact</a>
</nav>

<h1>Contact</h1>

<p>Pour toute demande :<br>
<a href="mailto:contact@lavaguemachine.fr">contact@lavaguemachine.fr</a></p>

</body>
</html>
