<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Agnès Vendeville</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* COULEURS */
    :root {
      --sable: #F4E9D8;
      --noir: #111;
      --brun: #8A6A3A;
    }

    /* STRUCTURE */
    body {
      background: var(--sable);
      color: var(--noir);
      font-family: Arial, sans-serif;
      margin: 40px auto;
      max-width: 780px;
      line-height: 1.65;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 40px;
      width: 3px;
      height: 100vh;
      background: var(--brun);
      opacity: 0.25;
    }

    /* TITRE */
    h1 {
      font-weight: normal;
      color: var(--brun);
      margin-top: 40px;
      font-size: 22px;
    }

    /* LIENS */
    a {
      color: var(--brun);
      opacity: 0.85;
      text-decoration: none;
    }

    a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* MOBILE */
    @media (max-width: 768px) {

      body {
        margin: 0;
        padding: 20px;
        max-width: 100%;
        text-align: center;
      }

      body::before {
        display: none;
      }

      h1 {
        font-size: 22px;
        margin-top: 10px;
        margin-bottom: 16px;
      }

      p, a, strong {
        font-size: 17px;
        line-height: 1.55;
      }
    }
  </style>
</head>

<body>

 <div class="hero-container">
  <img src="imagebandeau-mer.jpg" alt="Mer calme avec voilier et cargo à l’horizon" class="bandeau-hero">
</div>

  <h1>Contact</h1>

  <p>
    <a href="mailto:contact@lavaguemachine.fr">contact@lavaguemachine.fr</a>
  </p>

<footer class="signature-site">
  <a href="index.html">
    <img src="symbole-architectonique-institutionnelle.webp" alt="Retour à l’accueil">
  </a>
</footer>
  
</body>
</html>
